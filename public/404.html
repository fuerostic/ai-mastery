<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Mastery</title>
    <script>
      // Redirect deep links on GitHub Pages back to the SPA.
      // pathSegmentsToKeep is 1 because the site is hosted at /ai-mastery/.
      // Pattern from rafgraph/spa-github-pages (MIT).
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
